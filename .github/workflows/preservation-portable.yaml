name: Portable preservation core
on:
  pull_request:
  push:
    branches: [master, main, gwas-harvest-preservation-20261115]
  workflow_dispatch:
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install standalone test dependencies
        shell: Rscript {0}
        run: install.packages(c("Rcpp", "testthat"), repos = "https://cloud.r-project.org")
      - name: Compile and test native R interface without Bioconductor dependencies
        shell: Rscript {0}
        run: source("tests/standalone/preservation.R")
      - name: Compile standalone C++ gold fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/native/run.sh
